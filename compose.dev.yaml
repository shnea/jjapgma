name: jjapgma-dev
services:
  db:
    image: postgres:17-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      POSTGRES_DB: jjapgma_dev
      POSTGRES_USER: jjapgma
      POSTGRES_PASSWORD: local-development-only
    ports: ['127.0.0.1:30138:5432']
    volumes: ['db-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jjapgma -d jjapgma_dev']
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: jjapgma-api:dev
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgres://jjapgma:local-development-only@db:5432/jjapgma_dev
    command: ['node', 'apps/api/dist/database/migrate.js']
    depends_on: { db: { condition: service_healthy } }
  api:
    image: jjapgma-api:dev
    build: { context: ., target: api }
    environment:
      NODE_ENV: development
      APP_URL: ${APP_URL:-http://localhost:30137}
      DEV_AUTH_BYPASS: ${DEV_AUTH_BYPASS:-true}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-jjapgma-web}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPE: ${OIDC_SCOPE:-openid profile basic offline_access}
      REFRESH_TOKEN_ENCRYPTION_KEY: ${REFRESH_TOKEN_ENCRYPTION_KEY:-}
      SHARE_APPROVAL_MODE: ${SHARE_APPROVAL_MODE:-auto}
      VERIFY_EMAIL_TTL_SECONDS: ${VERIFY_EMAIL_TTL_SECONDS:-86400}
      NOTIFY_API_URL: ${NOTIFY_API_URL:-https://notify.shnea.kr/v1/notifications}
      NOTIFY_API_TOKEN: ${NOTIFY_API_TOKEN:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_WEBHOOK_URL: ${AI_WEBHOOK_URL:-https://n8n.shnea.kr/webhook/jjapgma}
      AI_WEBHOOK_TOKEN: ${AI_WEBHOOK_TOKEN:-}
      AI_MCP_TOKEN: ${AI_MCP_TOKEN:-}
      FILE_SERVICE_BASE_URL: ${FILE_SERVICE_BASE_URL:-https://file.shnea.kr}
      FILE_SERVICE_BEARER_TOKEN: ${FILE_SERVICE_BEARER_TOKEN:-}
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-10485760}
      DATABASE_URL: postgres://jjapgma:local-development-only@db:5432/jjapgma_dev
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  nginx:
    image: jjapgma-nginx:dev
    build: { context: ., target: nginx }
    ports: ['${NGINX_BIND_ADDRESS:-127.0.0.1}:${NGINX_HTTP_PORT:-30137}:8080']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:8080/api/health']
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db-data:
